   <style>
:root {
    --bg: #050505;          /* Preto profundo */
    --card: #0d0d0d;        /* Cinza quase preto */
    --text: #e0e0e0;
    --green: #00ff41;       /* Verde Matrix/Razer */
    --red: #ff0055;         /* Vermelho Neon */
    --yellow: #f39c12; 
    --blue: #00d4ff;        /* Azul Ciano Cyber */
    --purple: #bc13fe;      /* Roxo Neon */
    --shadow: rgba(0, 212, 255, 0.2);
}

/* Efeito de Scanline (linhas de TV antiga) no fundo */
body::before {
    content: " ";
    display: block;
    position: fixed;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
    z-index: 9999;
    background-size: 100% 2px, 3px 100%;
    pointer-events: none;
}

/* Cards com bordas de neon */
.item-wrapper {
    height: auto !important;
    min-height: 95px;
    margin-bottom: 20px !important;
    background: #1a1a1a !important;
    border-radius: 4px !important; /* Bordas menos arredondadas = mais tech */
    clip-path: polygon(0 0, 95% 0, 100% 25%, 100% 100%, 5% 100%, 0 75%); /* Corte angular gamer */
    border: 1px solid rgba(0, 212, 255, 0.3) !important;
}

.item-body {
    background: var(--card) !important;
    border-left: 4px solid var(--blue) !important;
    padding: 15px !important;
    transition: all 0.3s ease;
}

/* Brilho ao redor do card baseado no status */
.status-pago { border-left-color: var(--green) !important; box-shadow: inset 5px 0 15px rgba(0, 255, 65, 0.1); }
.status-pendente { border-left-color: var(--red) !important; box-shadow: inset 5px 0 15px rgba(255, 0, 85, 0.1); }

/* Títulos com fonte Rajdhani */
.card-title {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--blue);
    text-shadow: 0 0 8px rgba(0, 212, 255, 0.5);
}

.badge-parcela {
    background: var(--blue);
    color: #000;
    padding: 1px 6px;
    font-size: 0.6rem;
    font-weight: 800;
    clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
    margin-left: 8px;
}

                               

* {
    /* Impede a seleção de texto em todo o site */
    -webkit-user-select: none; /* Safari/Chrome */
    -ms-user-select: none;     /* Internet Explorer/Edge */
    user-select: none;         /* Regra padrão */

    /* Remove o realce azul/cinza ao tocar em elementos no mobile */
    -webkit-tap-highlight-color: transparent;
    
    /* Remove o contorno de foco (opcional, use com cautela por acessibilidade) */
    outline: none;
}

/* Se você tiver campos de entrada (input), precisa liberar a seleção neles */
input, textarea {
    -webkit-user-select: text;
    user-select: text;
}


/* BARRA FIXA: Saldo, Pago, Falta (fica presa no topo) */
.resumo-fixo {
pointer-events: none; /* Deixa os cliques passarem por ela quando escondida */
    /* ... regras anteriores ... */
    max-width: 100vw; /* Garante que não passe da largura da tela */
    box-sizing: border-box; /* Inclui o padding no cálculo da largura */
    position: fixed; /* Flutua sobre o conteúdo, não ocupa espaço no fluxo */
    top: 0;
    left: 0;
    right: 0;
    z-index: 10000; /* Fica acima de absolutamente tudo */
    background: var(--card);
    display: flex;
    justify-content: space-around;
    padding: 15px 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    border-bottom: 2px solid var(--blue);

    /* Efeito de deslizar suavemente de cima para baixo */
    transform: translateY(-100%); 
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    
}

/* Quando estiver visível, ela desliza para a posição 0 */
.resumo-fixo.visivel {
    transform: translateY(0);
    pointer-events: auto; /* Volta a aceitar cliques (se houver) quando aparece */
}
/* Card de Navegação Ultra Compacto */
.nav-container {
    background: var(--card);
    padding: 8px 10px;
    border-radius: 12px;
    margin-bottom: 8px;
    box-shadow: 0 2px 5px var(--shadow);
    display: flex;
    justify-content: center;
}

.month-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 300px; /* Limita a largura para não espalhar demais no PC */
}

.month-nav i {
    padding: 5px 12px; /* Área de toque boa, mas sem ocupar altura */
    cursor: pointer;
    color: var(--blue);
    font-size: 0.9rem; /* Setas menores */
}

/* Estilo dos Selects Minimalistas */
.filter-select {
    border: none;
    background: transparent;
    color: var(--text);
    font-weight: bold;
    font-size: 0.85rem; /* Fonte menor */
    padding: 2px;
    cursor: pointer;
    outline: none;
}

/* Card de Resumo também um pouco mais compacto para combinar */
.resumo-card {
    background: var(--card);
    padding: 8px;
    border-radius: 10px;
    margin-bottom: 8px;
    box-shadow: 0 2px 5px var(--shadow);
    display: flex;
    justify-content: space-around;
}


.resumo-item {
    text-align: center;
    flex: 1;
}

.resumo-item span {
    display: block;
    font-size: 0.7rem;
    text-transform: uppercase;
    color: var(--text);
    opacity: 0.7;
}

.resumo-item b {
    font-size: 0.9rem;
}


/* Card do Gráfico */
.chart-card {
    background: var(--card);
    border-radius: 12px;
    margin-bottom: 0px; /* Margem controlada pelo container do botão */
    overflow: hidden;
    transition: all 0.3s ease-in-out;
    box-shadow: 0 2px 8px var(--shadow);
    max-height: 1000px; /* Altura máxima quando aberto */
    opacity: 1;
}

/* Estado quando o gráfico some COMPLETAMENTE */
.chart-card.oculto {
    max-height: 0 !important;
    opacity: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
    border: none !important;
    pointer-events: none;
}

/* Container do Botão que fica sempre abaixo do que estiver visível */
.btn-toggle-container {
    display: flex;
    justify-content: center;
    margin-top: 5px; /* Espaço após o card de cima */
    margin-bottom: 15px;
}

.btn-toggle-dash {
    background: var(--blue);
    color: white;
    padding: 5px 20px;
    border-radius: 20px; /* Estilo pílula para ficar bonito abaixo dos cards */
    font-size: 0.7rem;
    font-weight: bold;
    cursor: pointer;
    border: none;
    box-shadow: 0 2px 5px var(--shadow);
}

<script>function toggleFabMenu() {
    const menu = document.getElementById('fabOptions');
    menu.classList.toggle('active');
    
    // Opcional: Efeito visual no botão principal ao abrir
    const mainBtn = document.querySelector('.fab-main');
    if (menu.classList.contains('active')) {
        mainBtn.style.transform = 'rotate(90deg)';
    } else {
        mainBtn.style.transform = 'rotate(0deg)';
    }
}

// Fecha o menu se clicar fora dele
document.addEventListener('click', function(event) {
    const container = document.querySelector('.fab-container');
    const menu = document.getElementById('fabOptions');
    if (!container.contains(event.target)) {
        menu.classList.remove('active');
        document.querySelector('.fab-main').style.transform = 'rotate(0deg)';
    }
});

function exportarParaJSON() {
    let backupGeral = {};
    let encontrouDados = false;

    // Varre todas as chaves que existem no localStorage do seu site
    for (let i = 0; i < localStorage.length; i++) {
        const chave = localStorage.key(i);
        const valor = localStorage.getItem(chave);
        
        // Filtra apenas as chaves que pertencem ao seu sistema
        // Adicionei os termos que você listou
        if (chave.includes('financas') || 
            chave.includes('contas') || 
            chave.includes('lancamentos') || 
            chave.includes('dados_financeiros') ||
            chave.includes('dash')) {
            
            try {
                // Tenta salvar como objeto JSON para o arquivo ficar limpo
                backupGeral[chave] = JSON.parse(valor);
            } catch (e) {
                // Se não for JSON (for texto puro), salva como está
                backupGeral[chave] = valor;
            }
            encontrouDados = true;
        }
    }

    if (!encontrouDados) {
        alert("⚠️ Nenhum dado encontrado no armazenamento do site!");
        return;
    }

    // Cria o arquivo
    const dataStr = JSON.stringify(backupGeral, null, 2);
    const blob = new Blob([dataStr], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    
    const link = document.createElement('a');
    link.href = url;
    link.download = `R7_Backup_Controle_Financeiro.json`;
    document.body.appendChild(link); // Necessário para alguns navegadores
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
}

function importarDeJSON(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const dadosImportados = JSON.parse(e.target.result);
            
            if (confirm("🚨 Confirmar restauração? Isso atualizará todos os seus dados.")) {
                
                // Limpa o que for importante antes (opcional, mas recomendado)
                // localStorage.clear(); 

                for (let chave in dadosImportados) {
                    let valor = dadosImportados[chave];
                    // Se o valor for um objeto (veio do JSON.parse no exportar), 
                    // precisamos converter de volta para String antes de salvar
                    if (typeof valor === 'object') {
                        valor = JSON.stringify(valor);
                    }
                    localStorage.setItem(chave, valor);
                }

                alert("✅ Dados restaurados com sucesso!");
                window.location.reload();
            }
        } catch (err) {
            alert("❌ O arquivo selecionado não é um backup válido.");
            console.error(err);
        }
    };
    reader.readAsText(file);
}

// Sistema de Gamificação e Score
function calcularGamificacao(receitas, pago, pendente) {
    let xp = 0;
    const totalDespesas = pago + pendente;
    
    // XP por pagamentos realizados
    const itensPagos = dados.filter(i => i.status === 'pago').length;
    xp += (itensPagos * 15);
    
    // Bônus por economia (se gasto < 70% da receita)
    if (receitas > 0 && totalDespesas < (receitas * 0.7)) {
        xp += 50;
    }
    
    // Cálculo de Nível (Cada 200 XP = 1 Nível)
    const nivel = Math.floor(xp / 200) + 1;
    const xpParaProximoNivel = xp % 200;
    const porcentagemXP = (xpParaProximoNivel / 200) * 100;
    
    // Saúde Financeira (Baseado na sobra de caixa)
    let score = 0;
    if (receitas > 0) {
        score = Math.max(0, Math.min(100, ((receitas - totalDespesas) / receitas) * 100));
    }

    // Atualiza Interface
    document.getElementById('user-level').innerText = `Nível ${nivel}`;
    document.getElementById('xp-fill').style.width = `${porcentagemXP}%`;
    document.getElementById('xp-total').innerText = xp;
    document.getElementById('health-score').innerText = `${score.toFixed(0)}%`;
    
    return { score, nivel };
}

    function atualizarExemploParcelas(){

 function salvarFinal(){
    const descVal = document.getElementById('desc').value.trim();
    const vRaw = document.getElementById('valor-brl').value.replace("R$ ","").replace(/\./g,"").replace(",",".");
    const val = parseFloat(vRaw); 
    const id = document.getElementById('edit-id').value;
    const dtStr = document.getElementById('data-lancto').value; 
    const dtOriginal = new Date(dtStr+"T12:00:00");

    // CORREÇÃO: Impede valor zero ou vazio
    if(!descVal || isNaN(val) || val <= 0) {
        alert("Por favor, insira um valor maior que R$ 0,00");
        return;
    }
          
    
    
    if(id){
        dados = dados.map(i => i.id == id ? {...i, desc:descVal, categoria:document.getElementById('categoria').value, valor:val, dia:dtOriginal.getDate(), mes:dtOriginal.getMonth(), ano:dtOriginal.getFullYear()} : i);
    } else {
        const mov = document.getElementById('mov').value; 
        const cat = document.getElementById('categoria').value;
        const tipoPag = document.getElementById('tipo-pagamento').value;
        
        if(tipoPag === 'parcelado' && mov === 'despesa'){
            const numParc = parseInt(document.getElementById('num-parcelas').value) || 2;
            const modo = document.getElementById('modo-parcelamento').value;
            const diaOriginal = dtOriginal.getDate(); 
            const grupoId = Date.now();
            for(let n=0; n<numParc; n++){
                let novaData = new Date(dtOriginal.getFullYear(), dtOriginal.getMonth() + n, 1, 12, 0, 0);
                let ultimoDiaMes = new Date(novaData.getFullYear(), novaData.getMonth() + 1, 0).getDate();
                novaData.setDate(Math.min(diaOriginal, ultimoDiaMes));
                let valorFinal = (modo === 'dividir') ? (val / numParc) : val;
                dados.push({id: Date.now() + n, grupoId: grupoId, desc: descVal, valor: valorFinal, mov: mov, categoria: cat, dia: novaData.getDate(), mes: novaData.getMonth(), ano: novaData.getFullYear(), status: 'pendente', valorPago: 0, parc: `${n+1}/${numParc}`});
            }
        } else {
            dados.push({id:Date.now(), desc:descVal, valor:val, mov:mov, categoria:cat, dia:dtOriginal.getDate(), mes:dtOriginal.getMonth(), ano:dtOriginal.getFullYear(), status:'pendente', valorPago:0});
        }
    }
    salvarDB(); fecharModais();
}

    function setPagoTotal(id){ 
    let i = dados.find(x => x.id === id); 
    if(i.status === 'pago') {
        i.status = 'pendente';
        i.valorPago = 0;
        delete i.dataPagamento; // Remove a data se desmarcar
    } else {
        i.status = 'pago';
        i.valorPago = i.valor;
        i.dataPagamento = new Date().toISOString(); // Registra o momento do clique
    }
    salvarDB(); 
}

    function setPagoParcial(id) {
    let i = dados.find(x => x.id === id);
    let v = prompt("Quanto pagou?", i.valorPago);
    
    if (v !== null && v.trim() !== "") {
        let valorNum = parseFloat(v.replace(",", "."));
        
        // Bloqueia se o valor for 0 ou negativo
        if (isNaN(valorNum) || valorNum <= 0) {
            alert("O valor parcial deve ser maior que zero.");
            return;
        }

        i.valorPago = valorNum;
        i.status = i.valorPago >= i.valor ? 'pago' : 'parcial';
        salvarDB();
    }
}

    const inputDesc = document.getElementById("desc");
const suggestionsBox = document.getElementById("autocomplete-list");

inputDesc.addEventListener("input", function() {
    const val = this.value;
    fecharSugestoes();
    if (!val || val.length < 1) return false;

    // Obtém nomes únicos das descrições já salvas no seu sistema
    const historico = [...new Set(dados.map(item => item.desc))];
    
    // Filtra os nomes que contêm o texto digitado
    const filtrados = historico.filter(nome => 
        nome.toLowerCase().includes(val.toLowerCase())
    );

    if (filtrados.length > 0) {
        suggestionsBox.style.display = "block";
        filtrados.forEach(nome => {
            const div = document.createElement("div");
            // Destaca a parte digitada
            div.innerHTML = nome.replace(new RegExp(val, "gi"), (match) => `<strong>${match}</strong>`);
            
            div.addEventListener("click", function() {
                inputDesc.value = nome;
                fecharSugestoes();
            });
            suggestionsBox.appendChild(div);
        });
    }
});

function fecharSugestoes() {
    suggestionsBox.innerHTML = "";
    suggestionsBox.style.display = "none";
}

// Fecha a lista se o usuário clicar fora do campo
document.addEventListener("click", function (e) {
    if (e.target !== inputDesc) fecharSugestoes();
});

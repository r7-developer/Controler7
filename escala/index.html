<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Logística PRO - Estável</title>
    <style>
        :root { --primary: #075e54; --secondary: #25d366; --accent: #007bff; --danger: #ff5252; --warning: #ffa000; --bg: #f0f2f5; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; padding: 10px; padding-bottom: 80px; }
        
        /* Toast Notification */
        #toast { visibility: hidden; min-width: 200px; background-color: #333; color: #fff; text-align: center; border-radius: 8px; padding: 16px; position: fixed; z-index: 1000; left: 50%; bottom: 30px; transform: translateX(-50%); }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }

        .header-box { background: var(--primary); color: white; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 15px; }
        .card { background: white; padding: 18px; border-radius: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 15px; }
        h2 { color: var(--primary); font-size: 1.1rem; margin: 0 0 15px 0; border-bottom: 2px solid var(--secondary); padding-bottom: 5px; }
        
        input, select { width: 100%; height: 45px; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
        button { width: 100%; min-height: 48px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        button:active { transform: scale(0.98); }

        .btn-save { background: var(--secondary); color: white; }
        .btn-copy { background: var(--accent); color: white; margin-top: 10px; }
        
        .disp-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #f1f1f1; font-size: 0.9rem; }
        .btn-status { width: 65px; height: 30px; border-radius: 15px; font-size: 0.7rem; color: white; }
        .status-on { background: var(--secondary); } .status-off { background: var(--danger); }

        .item-escala { background: #fffde7; padding: 12px; margin: 10px 0; border-radius: 10px; border-left: 5px solid var(--warning); display: flex; justify-content: space-between; align-items: center; }
        .actions { display: flex; gap: 8px; }
        .btn-circle { width: 38px; height: 38px; border-radius: 50%; color: white; }

        #listaBusca div { padding: 15px; border-bottom: 1px solid #eee; background: white; }
        #camposExtras { background: #e3f2fd; border: 2px solid var(--accent); padding: 15px; border-radius: 12px; margin-top: 10px; }
        
        .btn-reset { background: none; color: #999; font-size: 0.7rem; text-decoration: underline; margin-top: 20px; }
    </style>
</head>
<body>

<div id="toast"></div>

<div class="header-box">
    <div id="dataHoje" style="font-weight: bold;"></div>
    <div id="dataAmanha" style="font-size: 0.8rem; opacity: 0.9;"></div>
</div>

<div class="card">
    <h2>🚚 Cadastro</h2>
    <select id="tipo"><option value="FROTA">FROTA</option><option value="AGREGADO">AGREGADO</option></select>
    <input type="text" id="nomeCompleto" placeholder="Nome do motorista">
    <select id="modelo"><option value="FIORINO">FIORINO</option><option value="VUC">VUC</option><option value="CARRO">CARRO</option></select>
    <button class="btn-save" onclick="salvarMotorista()">💾 SALVAR MOTORISTA</button>
</div>

<div class="card">
    <h2>📝 Escala</h2>
    <select id="turnoSelecao"><option value="AM">TURNO AM</option><option value="PM">TURNO PM</option></select>
    <input type="text" id="buscaMotorista" placeholder="Buscar para escalar..." oninput="buscar(this.value)">
    <div id="listaBusca"></div>
    
    <div id="camposExtras" style="display:none;">
        <b id="nomeSeleccionado"></b>
        <input type="text" id="rotaInput" placeholder="📍 Rota">
        <input type="text" id="romaneioInput" placeholder="🔢 Romaneio">
        <button onclick="confirmarAdicao()" style="background:var(--accent); color:white;">✅ ADICIONAR / ATUALIZAR</button>
    </div>

    <div id="revisaoEscala"></div>
    
    <button class="btn-copy" onclick="gerarTexto('AM')">📋 COPIAR AM</button>
    <button class="btn-copy" onclick="gerarTexto('PM')" style="background:#6610f2">📋 COPIAR PM</button>
    <button class="btn-copy" onclick="gerarTextoDisp()" style="background:#28a745">✅ COPIAR DISP.</button>
</div>

<div class="card">
    <h2>📂 Banco de Dados</h2>
    <div id="listaDisponibilidade"></div>
    <div id="listaGeralExclusao" style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px;"></div>
    <button class="btn-reset" onclick="resetBanco()">Limpar Banco e Recomeçar</button>
</div>

<script>
    // CHAVE ÚNICA DE SEGURANÇA
    const DB_KEY = 'SISTEMA_LOGISTICA_FINAL_V11';
    
    let motoristas = [];
    let escalaAtual = { AM: [], PM: [] };
    let motoristaEmEdicao = null;
    let indexEdicao = -1;

    // Inicialização segura
    window.onload = function() {
        const salvos = localStorage.getItem(DB_KEY);
        if (salvos) {
            motoristas = JSON.parse(salvos);
        }
        renderTudo();
        configDatas();
    };

    function configDatas() {
        const hoje = new Date();
        const amanha = new Date(); amanha.setDate(hoje.getDate() + 1);
        const format = (d) => d.toLocaleDateString('pt-BR', {weekday:'short', day:'2-digit', month:'2-digit'}).toUpperCase();
        document.getElementById('dataHoje').innerText = "HOJE: " + format(hoje);
        document.getElementById('dataAmanha').innerText = "AMANHÃ: " + format(amanha);
    }

    function showToast(msg) {
        const x = document.getElementById("toast");
        x.innerText = msg;
        x.className = "show";
        setTimeout(() => { x.className = x.className.replace("show", ""); }, 2000);
    }

    function salvarNoLocalStorage() {
        try {
            localStorage.setItem(DB_KEY, JSON.stringify(motoristas));
            return true;
        } catch (e) {
            showToast("❌ Erro ao salvar! Memória cheia.");
            return false;
        }
    }

    function salvarMotorista() {
        const nome = document.getElementById('nomeCompleto').value.trim();
        if(!nome) { showToast("⚠️ Digite o nome!"); return; }
        
        motoristas.push({
            nome: nome.toUpperCase(),
            tipo: document.getElementById('tipo').value,
            modelo: document.getElementById('modelo').value,
            ativo: true
        });
        
        motoristas.sort((a,b) => a.nome.localeCompare(b.nome));
        
        if(salvarNoLocalStorage()) {
            document.getElementById('nomeCompleto').value = "";
            renderTudo();
            showToast("✅ Salvo no Banco!");
        }
    }

    function renderTudo() {
        renderDisponibilidade();
        renderListaExclusao();
    }

    function renderDisponibilidade() {
        const lista = document.getElementById('listaDisponibilidade');
        lista.innerHTML = "<b>Status Frota:</b>";
        ['FIORINO', 'VUC'].forEach(mod => {
            const f = motoristas.filter(m => m.tipo === 'FROTA' && m.modelo === mod);
            if(f.length > 0) {
                lista.innerHTML += `<div style="font-size:0.7rem; color:#777; margin-top:10px;">${mod}S</div>`;
                f.forEach(m => {
                    const idx = motoristas.indexOf(m);
                    lista.innerHTML += `<div class="disp-item">
                        <span>${m.ativo ? '🟢' : '🔴'} ${m.nome.split(' ')[0]}</span>
                        <button onclick="toggleStatus(${idx})" class="btn-status ${m.ativo ? 'status-on' : 'status-off'}">${m.ativo ? 'DISP' : 'FOLGA'}</button>
                    </div>`;
                });
            }
        });
    }

    function renderListaExclusao() {
        const container = document.getElementById('listaGeralExclusao');
        container.innerHTML = "<b>Gestão do Banco:</b>";
        motoristas.forEach((m, idx) => {
            container.innerHTML += `<div class="disp-item">
                <span style="font-size:0.8rem">${m.nome} (${m.tipo})</span>
                <button onclick="removerMotorista(${idx})" style="color:red; background:none; font-weight:bold; border:none;">EXCLUIR</button>
            </div>`;
        });
    }

    function toggleStatus(i) {
        motoristas[i].ativo = !motoristas[i].ativo;
        salvarNoLocalStorage();
        renderTudo();
    }

    function removerMotorista(idx) {
        if(confirm("Excluir definitivamente?")) {
            motoristas.splice(idx, 1);
            salvarNoLocalStorage();
            renderTudo();
            showToast("🗑️ Removido!");
        }
    }

    function buscar(val) {
        const sug = document.getElementById('listaBusca');
        sug.innerHTML = "";
        if(!val) return;
        motoristas.filter(m => m.nome.toLowerCase().includes(val.toLowerCase())).forEach(m => {
            const d = document.createElement('div');
            d.innerText = `[${m.tipo}] ${m.nome}`;
            d.onclick = () => {
                motoristaEmEdicao = m; indexEdicao = -1;
                document.getElementById('nomeSeleccionado').innerText = m.nome;
                document.getElementById('rotaInput').value = ""; document.getElementById('romaneioInput').value = "";
                document.getElementById('camposExtras').style.display = "block";
                sug.innerHTML = ""; document.getElementById('buscaMotorista').value = "";
            };
            sug.appendChild(d);
        });
    }

    function confirmarAdicao() {
        const turno = document.getElementById('turnoSelecao').value;
        const dados = { ...motoristaEmEdicao, rota: (document.getElementById('rotaInput').value || "S/R").toUpperCase(), romaneio: (document.getElementById('romaneioInput').value || "S/R").toUpperCase() };
        if(indexEdicao > -1) escalaAtual[turno][indexEdicao] = dados;
        else escalaAtual[turno].push(dados);
        document.getElementById('camposExtras').style.display = "none";
        renderRevisao();
        showToast("✅ Lista atualizada!");
    }

    function renderRevisao() {
        const div = document.getElementById('revisaoEscala');
        div.innerHTML = "<b style='display:block; margin-top:15px;'>Revisão:</b>";
        ['AM', 'PM'].forEach(t => {
            escalaAtual[t].forEach((m, idx) => {
                div.innerHTML += `<div class="item-escala">
                    <div style="font-size:0.85rem"><b>${m.nome.split(' ')[0]} [${t}]</b><br>${m.rota} | ${m.romaneio}</div>
                    <div class="actions">
                        <button class="btn-circle" style="background:var(--warning)" onclick="editarEscalado('${t}', ${idx})">✏️</button>
                        <button class="btn-circle" style="background:var(--danger)" onclick="escalaAtual['${t}'].splice(${idx}, 1); renderRevisao();">🗑️</button>
                    </div>
                </div>`;
            });
        });
    }

    function editarEscalado(turno, idx) {
        const m = escalaAtual[turno][idx];
        motoristaEmEdicao = m; indexEdicao = idx;
        document.getElementById('turnoSelecao').value = turno;
        document.getElementById('nomeSeleccionado').innerText = m.nome;
        document.getElementById('rotaInput').value = m.rota;
        document.getElementById('romaneioInput').value = m.romaneio;
        document.getElementById('camposExtras').style.display = "block";
    }

    function gerarTexto(t) {
        if(escalaAtual[t].length === 0) return showToast("⚠️ Escala vazia!");
        let txt = `📋 *ESCALA ${t} - ${document.getElementById('dataHoje').innerText.split(': ')[1]}*\n\n`;
        ['CARRO', 'FIORINO', 'VUC'].forEach(mod => {
            let f = escalaAtual[t].filter(m => m.modelo === mod).sort((a,b) => a.nome.localeCompare(b.nome));
            if(f.length > 0) {
                txt += `*${mod === 'CARRO' ? 'AGREGADOS' : mod + 'S'}:*\n` + 
                       f.map(m => `• ${m.nome.split(' ')[0]} - ${m.rota} - ${m.romaneio}`).join('\n') + `\n\n`;
            }
        });
        navigator.clipboard.writeText(txt).then(() => showToast("📋 Copiado!"));
    }

    function gerarTextoDisp() {
        const amanhaStr = document.getElementById('dataAmanha').innerText.split(': ')[1] || "";
        let txt = `✅ *DISPONIBILIDADE AMANHÃ - ${amanhaStr}*\n`;
        ['FIORINO', 'VUC'].forEach(mod => {
            let f = motoristas.filter(m => m.tipo === 'FROTA' && m.modelo === mod).sort((a,b) => a.nome.localeCompare(b.nome));
            if(f.length > 0) txt += `\n*${mod}S:*\n` + f.map(m => `${m.ativo ? '🟢' : '🔴'} ${m.nome.split(' ')[0]}`).join('\n') + `\n`;
        });
        navigator.clipboard.writeText(txt).then(() => showToast("✅ Copiado!"));
    }

    function resetBanco() {
        if(confirm("Isso apagará todos os motoristas cadastrados. Tem certeza?")) {
            localStorage.removeItem(DB_KEY);
            location.reload();
        }
    }
</script>
</body>
</html>
